<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos</title>
</head>

<body>

<h1>Página de Pedidos</h1>

<p id="coleccion"></p>
<p id="modo"></p>
<p id="plantilla"></p>
<div id="modelosContainer"></div>
<script>

const params = new URLSearchParams(window.location.search);

const coleccion = params.get("coleccion");
const modo = params.get("modo");
const plantilla = params.get("plantilla");
if (plantilla === "abuela_tata_comunion") {
    document.body.style.background = "#f5f5f5";

    const titulo = document.querySelector("h1");
    titulo.textContent = "Pedidos Abuela Tata Comunión 2027";

    console.log("Cargando plantilla Abuela Tata");
}

if (plantilla === "navy_blue_comunion") {
    document.body.style.background = "#eef4ff";

    const titulo = document.querySelector("h1");
    titulo.textContent = "Pedidos Navy & Blue Comunión 2027";

    console.log("Cargando plantilla Navy & Blue");
}
  
document.getElementById("coleccion").textContent =
"Colección: " + coleccion;

document.getElementById("modo").textContent =
"Modo: " + modo;

document.getElementById("plantilla").textContent =
"Plantilla: " + plantilla;

console.log("Colección:", coleccion);
console.log("Modo:", modo);
console.log("Plantilla:", plantilla);

</script>
<script src="./js/plantillas-pedido/abuela_tata_comunion.js"></script>
<script src="./js/plantillas-pedido/navy_blue_comunion.js"></script>

<script>
const plantillaActiva = window.PlantillasPedido?.[plantilla];
async function cargarModelos() {

    try {

        const respuesta = await fetch(
            `data/modelos/${coleccion}.json`
        );

        const modelos = await respuesta.json();

        console.log("Modelos cargados:", modelos);

    } catch(error) {

        console.error("Error cargando modelos:", error);

    }

}

cargarModelos();
if (plantillaActiva && typeof plantillaActiva.inicializar === "function") {
    plantillaActiva.inicializar({
        coleccion: coleccion,
        modo: modo,
        plantilla: plantilla
    });
} else {
    console.error("No se encontró la plantilla de pedido:", plantilla);
}
</script>

</body>
</html>
