<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos · Área Profesional B2B</title>
<link rel="stylesheet" href="css/pedidos.css">
</head>

<body>

<header class="pedidos-header">
    <div>
        <p class="eyebrow">Área Profesional B2B</p>
        <h1 id="tituloPedidos">Pedidos</h1>
        <p class="subtitulo" id="descripcionPedidos">
            Selecciona productos, consulta disponibilidad y prepara el pedido.
        </p>
    </div>
</header>

<main class="pedidos-layout">

    <section class="panel-info">
        <div class="info-card">
            <span>Colección</span>
            <strong id="coleccion">-</strong>
        </div>

        <div class="info-card">
            <span>Modo</span>
            <strong id="modo">-</strong>
        </div>

        <div class="info-card">
            <span>Plantilla</span>
            <strong id="plantilla">-</strong>
        </div>

        <div class="info-card">
            <span>Fecha pedido</span>
            <strong id="fechaPedido">-</strong>
        </div>
    </section>

    <section class="productos-section">
        <div class="section-head">
            <div>
                <h2>Modelos disponibles</h2>
                <p>Consulta stock, repetición o fabricación según campaña.</p>
            </div>
        </div>

        <div id="modelosContainer" class="productos-grid"></div>
    </section>

</main>

<script>
const params = new URLSearchParams(window.location.search);

const coleccion = params.get("coleccion");
const modo = params.get("modo");
const plantilla = params.get("plantilla");

const fechaPedido = new Date();

function formatearFecha(fecha) {
    return fecha.toLocaleDateString("es-ES", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    });
}

document.getElementById("coleccion").textContent = coleccion || "-";
document.getElementById("modo").textContent = modo || "-";
document.getElementById("plantilla").textContent = plantilla || "-";
document.getElementById("fechaPedido").textContent = formatearFecha(fechaPedido);

if (plantilla === "abuela_tata_comunion") {
    document.body.classList.add("tema-abuela-tata");

    document.getElementById("tituloPedidos").textContent =
        "Pedidos Abuela Tata · Comunión 2027";

    document.getElementById("descripcionPedidos").textContent =
        "Vestidos de comunión, tiaras y lazadas con stock inmediato o fabricación bajo pedido.";
}

if (plantilla === "navy_blue_comunion") {
    document.body.classList.add("tema-navy-blue");

    document.getElementById("tituloPedidos").textContent =
        "Pedidos Navy & Blue · Comunión 2027";

    document.getElementById("descripcionPedidos").textContent =
        "Marineros, almirantes y complementos con control de stock y fabricación.";
}

console.log("Colección:", coleccion);
console.log("Modo:", modo);
console.log("Plantilla:", plantilla);
</script>

<script src="./js/plantillas-pedido/abuela_tata_comunion.js"></script>
<script src="./js/plantillas-pedido/navy_blue_comunion.js"></script>
<script src="./js/pedido-core.js"></script>
<script src="./js/motores/abuela-tata-comunion.js"></script>
<script src="./js/pedidos.js"></script>

<script>
const plantillaActiva = window.PlantillasPedido?.[plantilla];

async function cargarModelos() {
    try {
        const respuesta = await fetch(`data/modelos/${coleccion}.json`);

        if (!respuesta.ok) {
            throw new Error("No se pudo cargar el JSON de modelos");
        }

        const modelos = await respuesta.json();

        console.log("Modelos cargados:", modelos);

        const contenedor = document.getElementById("modelosContainer");
        contenedor.innerHTML = "";

        modelos.forEach(modelo => {
            const servicioTexto = modo === "stock"
                ? "Servicio inmediato"
                : "Fabricación / repetición";

            const servicioClase = modo === "stock"
                ? "servicio-inmediato"
                : "servicio-fabricacion";

            contenedor.innerHTML += `
                <article class="producto-card">

                    <div class="producto-imagen">
                        <img src="${modelo.imagen}" alt="${modelo.nombre}">
                    </div>

                    <div class="producto-contenido">

                        <div class="producto-top">
                            <span class="producto-familia">
                                Familia ${modelo.familia || "-"}
                            </span>

                            <span class="estado-servicio ${servicioClase}">
                                ${servicioTexto}
                            </span>
                        </div>

                        <h3>${modelo.nombre}</h3>

                        <p class="referencia">
                            Ref. ${modelo.referencia}
                        </p>

                        <div class="producto-datos">
                            <div>
                                <span>Fecha pedido</span>
                                <strong>${formatearFecha(fechaPedido)}</strong>
                            </div>

                            <div>
                                <span>Servicio</span>
                                <strong>${servicioTexto}</strong>
                            </div>
                        </div>

                        <div class="producto-acciones">
                            <button class="btn-secundario" onclick="alert('Detalle de ${modelo.nombre}')">
                                Ver detalle
                            </button>

                            <button class="btn-principal" onclick="alert('Añadir ${modelo.nombre} al pedido')">
                                Añadir al pedido
                            </button>
                        </div>

                    </div>

                </article>
            `;
        });

    } catch(error) {
        console.error("Error cargando modelos:", error);

        document.getElementById("modelosContainer").innerHTML = `
            <div class="error-card">
                No se han podido cargar los modelos de esta colección.
            </div>
        `;
    }
}

cargarModelos();

if (plantillaActiva && typeof plantillaActiva.inicializar === "function") {
    plantillaActiva.inicializar({
        coleccion,
        modo,
        plantilla,
        fechaPedido: formatearFecha(fechaPedido)
    });
} else {
    console.error("No se encontró la plantilla de pedido:", plantilla);
}
</script>

</body>
</html>
